<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szybki Weryfikator Finansowy Online</title>
    <meta name="description" content="Sprawdź swoje możliwości finansowe w 30 sekund bez podawania PESEL-u. Bezpłatna weryfikacja online.">
    
    <!-- TUTAJ WKLEJ SWÓJ TAG WERYFIKACYJNY GOOGLE W RAZIE POTRZEBY -->
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Weryfikator Finansowy Online",
      "description": "Darmowe narzędzie online do analizy budżetu i weryfikacji możliwości finansowych w 30 sekund.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "PLN"
      }
    }
    </script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #10b981;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #1e293b;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 28px 22px;
            border-radius: 20px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.07);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="number"], select {
            width: 100%;
            padding: 14px 14px 14px 40px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        select {
            padding-left: 14px;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        #loading-state {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="badge-live">
                <span class="dot"></span> 1,482 Analiz Dzisiaj
            </div>
            <h1>Weryfikator Finansowy</h1>
            <p class="subtitle">Bezpieczna analiza możliwości w 30 sekund</p>
        </header>

        <main class="card">
            <form id="calc-form" onsubmit="handleProcess(event)">
                <div class="form-group">
                    <label for="income">Miesięczny dochód netto (PLN):</label>
                    <div class="input-wrapper">
                        <span class="input-icon">PLN</span>
                        <input type="number" id="income" placeholder="4500" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="expenses">Miesięczne stałe zobowiązania:</label>
                    <div class="input-wrapper">
                        <span class="input-icon">PLN</span>
                        <input type="number" id="expenses" placeholder="1800" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="purpose">Cel weryfikacji:</label>
                    <select id="purpose">
                        <option value="szybka_analiza">Analiza zdolności finansowej</option>
                        <option value="optymalizacja">Optymalizacja budżetu</option>
                        <option value="pozyczka">Weryfikacja dostępnych opcji</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Rozpocznij Analizę &rarr;</button>
            </form>

            <div id="loading-state">
                <div class="spinner"></div>
                <p style="font-size: 0.9rem; font-weight: 600; color: #334155;">Przetwarzanie danych...</p>
                <p style="font-size: 0.78rem; color: #64748b; margin-top: 4px;">Szukam najlepszych opcji w systemie</p>
            </div>
        </main>

        <div class="features-grid">
            <div class="feature-item">⚡ Wynik natychmiast</div>
            <div class="feature-item">🔒 100% Ananimowo</div>
        </div>

        <footer>
            <p>&copy; 2026 Weryfikator Finansowy. Wszelkie prawa zastrzeżone.</p>
        </footer>
    </div>

    <script>
        function handleProcess(event) {
            event.preventDefault();
            document.getElementById('calc-form').style.display = 'none';
            document.getElementById('loading-state').style.display = 'block';

            setTimeout(() => {
                // TUTAJ WKLEJ LINK, NA KTÓRY MA PRZEKIEROWYWAĆ PO ANALIZIE (np. Twój link reklamowy/blog.html)
                window.location.href = "blog.html"; 
            }, 2000);
        }
    </script>

</body>
</html>

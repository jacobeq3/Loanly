<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">

    <title>Loanly — Porównywarka pożyczek online</title>

    <meta name="description" content="Loanly pomaga sprawdzić dostępne oferty finansowania online. Wypełnij krótki formularz i przejdź do ofert partnerów.">
    <meta name="robots" content="index, follow">
    <meta name="mylead-verification" content="cabf54576327bad7c52862bd33168f9e">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f5f7fb;
            --white: #ffffff;
            --text: #111827;
            --muted: #64748b;
            --border: #e5eaf1;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --green: #16a34a;
            --green-light: #ecfdf3;
            --blue-light: #eff6ff;
            --shadow: 0 12px 35px rgba(15, 23, 42, .08);
            --shadow-hover: 0 18px 45px rgba(15, 23, 42, .13);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .container {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
        }

        /* NAVBAR */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-weight: 800;
            box-shadow: 0 7px 18px rgba(37,99,235,.25);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* HERO */

        .hero {
            padding: 70px 0 45px;
            background:
                radial-gradient(circle at 15% 20%, rgba(37,99,235,.10), transparent 30%),
                radial-gradient(circle at 85% 20%, rgba(79,70,229,.09), transparent 30%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr .85fr;
            align-items: center;
            gap: 50px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--blue-light);
            color: var(--primary);
            border: 1px solid #dbeafe;
            padding: 8px 13px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(38px, 5vw, 62px);
            line-height: 1.04;
            letter-spacing: -2.5px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero-text {
            max-width: 650px;
            color: var(--muted);
            font-size: 18px;
            margin-bottom: 28px;
        }

        .hero-points {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .hero-point {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            color: #334155;
            font-weight: 600;
        }

        .check {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            font-size: 12px;
            font-weight: 800;
        }

        .hero-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .hero-card-icon {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: var(--blue-light);
            color: var(--primary);
            font-size: 28px;
            margin-bottom: 20px;
        }

        .hero-card h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .hero-card p {
            color: var(--muted);
            font-size: 14px;
        }

        /* TRUST BAR */

        .trust-bar {
            background: white;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .trust-inner {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 18px 0;
        }

        .trust-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        /* FORM */

        .main-section {
            padding: 60px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title h2 {
            font-size: 34px;
            letter-spacing: -1px;
            margin-bottom: 9px;
        }

        .section-title p {
            color: var(--muted);
            max-width: 680px;
            margin: auto;
        }

        .form-wrapper {
            max-width: 800px;
            margin: auto;
            background: white;
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .progress-area {
            padding: 22px 28px 0;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 7px;
            background: #e9eef5;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            width: 14.28%;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            transition: width .3s ease;
        }

        .form-content {
            padding: 32px;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        .step-title {
            font-size: 25px;
            margin-bottom: 8px;
            letter-spacing: -.5px;
        }

        .step-description {
            color: var(--muted);
            margin-bottom: 26px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .input,
        .select {
            width: 100%;
            min-height: 50px;
            padding: 0 15px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            background: white;
            color: var(--text);
            outline: none;
            font-size: 15px;
            transition: .2s;
        }

        .input:focus,
        .select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,.10);
        }

        .range-value {
            font-size: 30px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 12px;
            margin-top: 7px;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .radio-card {
            position: relative;
        }

        .radio-card input {
            position: absolute;
            opacity: 0;
        }

        .radio-card label {
            display: flex;
            align-items: center;
            min-height: 52px;
            padding: 12px 15px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: .2s;
        }

        .radio-card input:checked + label {
            border-color: var(--primary);
            background: var(--blue-light);
            color: var(--primary);
        }

        .form-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            border: 0;
            border-radius: 12px;
            min-height: 50px;
            padding: 0 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            transition: .2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            margin-left: auto;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .consent {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            background: #f8fafc;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        /* LOADING */

        #loading-state {
            display: none;
            max-width: 800px;
            margin: 0 auto 60px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 55px 30px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .loader {
            width: 58px;
            height: 58px;
            border: 5px solid #dbeafe;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading-state h2 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        #loading-message {
            color: var(--muted);
            min-height: 25px;
        }

        .loading-progress {
            height: 6px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            max-width: 430px;
            margin: 25px auto 0;
        }

        #loading-progress-fill {
            height: 100%;
            width: 0;
            background: var(--primary);
            transition: width .3s ease;
        }

        /* RESULTS */

        #results-screen {
            display: none;
            padding: 60px 0 70px;
            background:
                linear-gradient(180deg, #eff6ff 0%, #f8fafc 32%, #f5f7fb 100%);
            border-top: 1px solid var(--border);
        }

        .results-header {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 35px;
        }

        .results-success {
            width: 66px;
            height: 66px;
            display: grid;
            place-items: center;
            margin: 0 auto 17px;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            font-size: 30px;
        }

        .results-header h2 {
            font-size: clamp(28px, 4vw, 40px);
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .results-header p {
            color: var(--muted);
            font-size: 15px;
        }

        .results-notice {
            max-width: 800px;
            margin: 0 auto 24px;
            padding: 14px 17px;
            border: 1px solid #dbeafe;
            background: #eff6ff;
            border-radius: 13px;
            color: #475569;
            font-size: 12px;
            text-align: center;
        }

        .offers-list {
            max-width: 850px;
            margin: 0 auto;
            display: grid;
            gap: 16px;
        }

        .offer-card {
            position: relative;
            background: white;
            border: 1px solid var(--border);
            border-radius: 19px;
            padding: 21px;
            box-shadow: 0 7px 25px rgba(15,23,42,.055);
            transition: .2s;
        }

        .offer-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: #d5def0;
        }

        .offer-card-top {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .offer-logo {
            width: 58px;
            height: 58px;
            min-width: 58px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: linear-gradient(135deg, #eff6ff, #e0e7ff);
            color: #1d4ed8;
            font-size: 18px;
            font-weight: 800;
            border: 1px solid #dbeafe;
        }

        .offer-main {
            flex: 1;
            min-width: 0;
        }

        .offer-name-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 5px;
        }

        .offer-name {
            font-size: 19px;
            font-weight: 800;
        }

        .partner-badge {
            padding: 4px 8px;
            background: #f1f5f9;
            color: #64748b;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .offer-description {
            color: #64748b;
            font-size: 13px;
            line-height: 1.55;
            margin-bottom: 13px;
        }

        .offer-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .offer-info span {
            background: #f8fafc;
            border: 1px solid #edf1f5;
            color: #475569;
            border-radius: 8px;
            padding: 6px 9px;
            font-size: 11px;
            font-weight: 700;
        }

        .offer-action {
            margin-left: auto;
            padding-left: 15px;
            display: flex;
            align-items: center;
        }

        .btn-offer {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-height: 46px;
            padding: 0 19px;
            border-radius: 11px;
            background: var(--primary);
            color: white;
            font-size: 13px;
            font-weight: 800;
            transition: .2s;
        }

        .btn-offer:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .results-footer {
            text-align: center;
            margin-top: 28px;
        }

        .restart-btn {
            background: transparent;
            border: 0;
            color: var(--primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        /* INFO */

        .info-section {
            padding: 70px 0;
            background: white;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .info-card {
            padding: 25px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: white;
        }

        .info-icon {
            width: 45px;
            height: 45px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: var(--blue-light);
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 800;
        }

        .info-card h3 {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .info-card p {
            color: var(--muted);
            font-size: 13px;
        }

        /* FAQ */

        .faq-section {
            padding: 70px 0;
        }

        .faq {
            max-width: 800px;
            margin: auto;
        }

        .faq-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .faq-question {
            width: 100%;
            padding: 18px 20px;
            border: 0;
            background: white;
            text-align: left;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .faq-answer {
            display: none;
            padding: 0 20px 18px;
            color: var(--muted);
            font-size: 13px;
        }

        .faq-item.open .faq-answer {
            display: block;
        }

        /* FOOTER */

        footer {
            background: #0b1220;
            color: #94a3b8;
            padding: 40px 0;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            align-items: flex-start;
        }

        .footer-brand {
            max-width: 430px;
        }

        .footer-logo {
            color: white;
            font-weight: 800;
            font-size: 20px;
            margin-bottom: 10px;
        }

        footer p {
            font-size: 12px;
            line-height: 1.7;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .footer-links a:hover {
            color: white;
        }

        .copyright {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #1e293b;
            font-size: 11px;
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {

            .hero-grid {
                grid-template-columns: 1fr;
            }

            .hero-card {
                display
